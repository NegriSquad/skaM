<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkChat | Личные сообщения</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
        <div id="authScreen" class="screen auth">
            <div class="auth-card">
                <div class="logo">💬 DarkChat</div>
                <div class="tabs">
                    <button id="loginTab" class="tab active">Вход</button>
                    <button id="registerTab" class="tab">Регистрация</button>
                </div>
                <div id="loginForm" class="form">
                    <input type="text" id="loginUsername" placeholder="Никнейм">
                    <input type="password" id="loginPassword" placeholder="Пароль">
                    <button id="doLoginBtn" class="btn-primary">Войти</button>
                </div>
                <div id="registerForm" class="form hidden">
                    <input type="text" id="regUsername" placeholder="Никнейм (от 3 до 20 символов)">
                    <input type="password" id="regPassword" placeholder="Пароль">
                    <button id="doRegisterBtn" class="btn-primary">Зарегистрироваться</button>
                </div>
                <div class="info">🔒 Пароли хранятся в открытом виде (учебный проект)</div>
            </div>
        </div>

        <!-- ОСНОВНОЙ ИНТЕРФЕЙС (ЧАТЫ + СООБЩЕНИЯ) -->
        <div id="mainScreen" class="screen main hidden">
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="user-info">
                        <span class="avatar">👤</span>
                        <span id="currentUserSidebar"></span>
                    </div>
                    <button id="logoutMainBtn" class="icon-btn" title="Выйти">🚪</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchUsers" placeholder="Поиск пользователей...">
                </div>
                <div class="users-list" id="usersList">
                    <!-- Список всех пользователей (кроме себя) -->
                </div>
                <div class="chats-list-header">Личные чаты</div>
                <div class="chats-list" id="chatsList">
                    <!-- Список диалогов -->
                </div>
            </div>
            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <span>Выберите чат</span>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-chat">👈 Выберите пользователя слева</div>
                </div>
                <div class="input-area" id="inputArea" style="display: none;">
                    <div class="message-input-wrapper">
                        <input type="text" id="messageInput" placeholder="Введите сообщение... (используйте @ для упоминания)" maxlength="500">
                        <button id="sendMsgBtn" class="send-button">➤</button>
                    </div>
                    <div id="mentionSuggestions" class="mention-suggestions hidden"></div>
                    <div class="input-footer">
                        <span>↵ Enter</span>
                        <span id="charCounter">0/500</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
