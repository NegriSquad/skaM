<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkChat | Мессенджер с паролем</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- ЭКРАН ВХОДА (С ПАРОЛЕМ) -->
        <div id="loginScreen" class="login-screen">
            <div class="login-card glass-effect">
                <div class="logo-icon">🔐💬</div>
                <h1>Dark<span style="color:#5865f2;">Chat</span></h1>
                <p class="subtitle">Вход или регистрация</p>
                <div class="input-group">
                    <label>👤 Никнейм</label>
                    <input type="text" id="nicknameInput" placeholder="Анна, Дмитрий..." maxlength="28" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>🔑 Пароль</label>
                    <input type="password" id="passwordInput" placeholder="••••••" maxlength="50">
                </div>
                <button id="loginBtn" class="btn-primary">🚀 Войти / Зарегистрироваться</button>
                <div class="security-note">
                    ⚠️ Пароль хранится в открытом виде (учебный проект).<br>
                    Для реального использования добавьте хеширование.
                </div>
            </div>
        </div>

        <!-- ИНТЕРФЕЙС ЧАТА -->
        <div id="chatScreen" class="chat-screen hidden">
            <div class="chat-header">
                <div class="header-left">
                    <div class="online-status-indicator">
                        <span class="pulse-dot"></span>
                        <span class="status-text">Live</span>
                    </div>
                    <h2># общий-чат</h2>
                </div>
                <div class="user-panel">
                    <div class="current-user">
                        <span class="user-avatar">👤</span>
                        <span class="user-name" id="currentUsernameDisplay"></span>
                    </div>
                    <button id="logoutBtn" class="icon-btn" title="Выйти">🚪</button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-emoji">💬</div>
                    <p>Нет сообщений. Напишите первым!</p>
                </div>
            </div>

            <div id="typingIndicatorContainer" class="typing-indicator hidden">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span id="typingText"></span>
            </div>

            <div class="input-area">
                <div class="message-input-wrapper">
                    <input type="text" id="messageInput" placeholder="Введите сообщение..." maxlength="500">
                    <button id="sendBtn" class="send-button">➤</button>
                </div>
                <div class="input-footer">
                    <span class="helper-text">↵ Enter</span>
                    <span id="charCounter">0/500</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
