<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>DarkChat | Мессенджер в реальном времени</title>
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (Compat – для простоты работы с Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-wrapper" id="appWrapper">
        <!-- ==================== ЭКРАН ВХОДА ==================== -->
        <div id="loginScreen" class="login-screen">
            <div class="login-card glass-effect">
                <div class="logo-animation">
                    <div class="logo-icon">💬✨</div>
                </div>
                <h1>Dark<span style="color:#5865f2;">Chat</span></h1>
                <p class="subtitle">Общайтесь с друзьями мгновенно</p>
                <div class="input-group">
                    <label for="nicknameInput">Ваш никнейм</label>
                    <input type="text" id="nicknameInput" placeholder="Алексей, Дмитрий, Анна..." maxlength="28" autocomplete="off">
                    <div class="input-hint">от 2 до 28 символов, без специальных знаков</div>
                </div>
                <button id="loginBtn" class="btn-primary">
                    <span>🚀 Войти в чат</span>
                </button>
                <div class="security-note">
                    🔒 Ваш ник виден всем • Сообщения хранятся в Firebase
                </div>
            </div>
        </div>

        <!-- ==================== ИНТЕРФЕЙС ЧАТА ==================== -->
        <div id="chatScreen" class="chat-screen hidden">
            <!-- Верхняя панель -->
            <div class="chat-header">
                <div class="header-left">
                    <div class="online-status-indicator">
                        <span class="pulse-dot"></span>
                        <span class="status-text">Live</span>
                    </div>
                    <h2># общий-чат</h2>
                </div>
                <div class="user-panel">
                    <div class="current-user" id="currentUsernameDisplay">
                        <span class="user-avatar">👤</span>
                        <span class="user-name"></span>
                    </div>
                    <button id="logoutBtn" class="icon-btn" title="Сменить ник">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>

            <!-- Контейнер сообщений с автопрокруткой -->
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-emoji">💬</div>
                    <p>Здесь пока нет сообщений</p>
                    <span class="empty-tip">Напишите что-нибудь, чтобы начать общение</span>
                </div>
            </div>

            <!-- Панель "Печатает..." (динамическая) -->
            <div id="typingIndicatorContainer" class="typing-indicator hidden">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <span id="typingText"></span>
            </div>

            <!-- Поле ввода сообщения -->
            <div class="input-area">
                <div class="message-input-wrapper">
                    <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off" maxlength="500">
                    <button id="sendBtn" class="send-button" title="Отправить">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="helper-text">↵ Enter для отправки</span>
                    <span id="charCounter" class="char-counter">0/500</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной JS-скрипт -->
    <script src="script.js"></script>
</body>
</html>
