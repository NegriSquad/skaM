<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkChat | Личные сообщения</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- ЭКРАН АВТОРИЗАЦИИ -->
        <div id="authScreen" class="screen auth">
            <div class="auth-card">
                <div class="logo">💬 DarkChat</div>
                <div class="tabs">
                    <button id="tabLogin" class="tab active">Вход</button>
                    <button id="tabRegister" class="tab">Регистрация</button>
                </div>
                <!-- Форма входа -->
                <div id="loginForm" class="form">
                    <input type="text" id="loginUsername" placeholder="Никнейм" autocomplete="off">
                    <input type="password" id="loginPassword" placeholder="Пароль">
                    <button id="btnLogin" class="btn-primary">Войти</button>
                </div>
                <!-- Форма регистрации -->
                <div id="registerForm" class="form hidden">
                    <input type="text" id="regUsername" placeholder="Никнейм (от 3 символов)">
                    <input type="password" id="regPassword" placeholder="Пароль">
                    <button id="btnRegister" class="btn-primary">Зарегистрироваться</button>
                </div>
                <div class="info">🔐 Пароли хранятся в открытом виде (учебный проект)</div>
            </div>
        </div>

        <!-- ОСНОВНОЙ ЭКРАН (ДВЕ КОЛОНКИ) -->
        <div id="mainScreen" class="screen main hidden">
            <!-- Левая панель: пользователи и чаты -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="user-info">
                        <span>👤</span>
                        <span id="currentUserLabel"></span>
                    </div>
                    <button id="logoutBtnMain" class="icon-btn" title="Выйти">🚪</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchUserInput" placeholder="Поиск пользователей...">
                </div>
                <div class="section-title">Все пользователи</div>
                <div class="users-list" id="usersList"></div>
                <div class="section-title">Мои диалоги</div>
                <div class="chats-list" id="chatsList"></div>
            </div>
            <!-- Правая панель: выбранный чат -->
            <div class="chat-area">
                <div class="chat-header" id="chatAreaHeader">
                    <span id="chatWithName">Выберите чат</span>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-chat">👈 Нажмите на пользователя слева</div>
                </div>
                <div class="input-area" id="inputPanel" style="display: none;">
                    <div class="message-input-wrapper">
                        <input type="text" id="messageInput" placeholder="Сообщение... (@ для упоминания)">
                        <button id="sendMessageBtn" class="send-button">➤</button>
                    </div>
                    <div id="mentionSuggestions" class="mention-suggestions hidden"></div>
                    <div class="input-footer">
                        <span>↵ Enter</span>
                        <span id="charCount">0/500</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
