<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DarkChat | Приватные сообщения</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="app-wrapper" id="appWrapper">

    <!-- ЭКРАН ВХОДА -->
    <div id="loginScreen" class="screen">
        <div class="auth-card">
            <div class="logo-icon">💬✨</div>
            <h1>Dark<span style="color:#5865f2;">Chat</span></h1>
            <p class="subtitle">Войдите в аккаунт</p>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="example@mail.ru">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••">
            </div>
            <button id="doLoginBtn" class="btn-primary">Войти</button>
            <p class="switch-action">Нет аккаунта? <span id="showRegisterBtn">Создать</span></p>
        </div>
    </div>

    <!-- ЭКРАН РЕГИСТРАЦИИ -->
    <div id="registerScreen" class="screen hidden">
        <div class="auth-card">
            <div class="logo-icon">🚀</div>
            <h1>Регистрация</h1>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label>@username (уникальный)</label>
                <input type="text" id="regUsername" placeholder="ivan" maxlength="24">
                <div class="input-hint">Только латиница, цифры, _</div>
            </div>
            <div class="input-group">
                <label>Отображаемое имя</label>
                <input type="text" id="regNickname" placeholder="Иван Петров">
            </div>
            <div class="input-group">
                <label>Пароль (мин. 6 символов)</label>
                <input type="password" id="regPassword" placeholder="••••••">
            </div>
            <button id="doRegisterBtn" class="btn-primary">Зарегистрироваться</button>
            <p class="switch-action">Уже есть аккаунт? <span id="showLoginFromRegBtn">Войти</span></p>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="mainAppScreen" class="chats-layout hidden">
        <!-- Левая панель диалогов (выезжающая на телефоне) -->
        <div class="chats-sidebar" id="chatsSidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <span class="user-avatar">👤</span>
                    <span id="sidebarUsername">@user</span>
                </div>
                <button id="globalLogoutBtn" class="icon-btn" title="Выйти">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
            <div class="search-area">
                <input type="text" id="searchUserInput" placeholder="Поиск по @username...">
                <button id="searchUserBtn" class="search-btn">🔍</button>
            </div>
            <div id="searchResults" class="search-results hidden"></div>
            <div class="dialogs-header">💬 Диалоги</div>
            <div id="dialogsList" class="dialogs-list">
                <div class="empty-dialogs">Нет диалогов</div>
            </div>
        </div>

        <!-- Оверлей для мобильного меню -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Правая область чата -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="header-left">
                    <button id="backToDialogsBtn" class="back-btn">←</button>
                    <h2 id="currentChatTitle">DarkChat</h2>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-emoji">💬</div>
                    <p>Выберите диалог</p>
                    <span style="font-size: 0.8rem; opacity: 0.6;">Нажмите ← чтобы открыть список</span>
                </div>
            </div>
            <div id="typingIndicatorContainer" class="typing-indicator hidden">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span id="typingText"></span>
            </div>
            <div class="input-area">
                <div class="message-input-wrapper">
                    <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off" maxlength="500">
                    <button id="sendBtn" class="send-button">📩</button>
                </div>
                <div class="input-footer">
                    <span>↵ Enter</span>
                    <span id="charCounter">0/500</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
